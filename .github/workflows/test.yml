name: Tests

on:
  push:
    branches: [main]
    paths:
      - '.claude/scripts/**'
      - '.scripts/**'
      - '.shardmind/**'
      # Suites here also guard files outside .claude/scripts/: the mod's
      # timeouts against settings.json, plugin.json's version against the
      # manifest, the hook commands' walk-up, and the delivery gate's judge.
      - '.claude/skills/obsidian-mind/**'
      - '.claude/settings.json'
      - '.github/scripts/**'
      - 'vault-manifest.json'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - '.claude/scripts/**'
      - '.scripts/**'
      - '.shardmind/**'
      # Suites here also guard files outside .claude/scripts/: the mod's
      # timeouts against settings.json, plugin.json's version against the
      # manifest, the hook commands' walk-up, and the delivery gate's judge.
      - '.claude/skills/obsidian-mind/**'
      - '.claude/settings.json'
      - '.github/scripts/**'
      - 'vault-manifest.json'
      - '.github/workflows/test.yml'

jobs:
  # qmd is optional for a vault, so the suite must pass on a machine without
  # it. Every leg below installs qmd, so nothing caught a pair of tests that
  # held only where qmd resolved, until the release job (which had no qmd)
  # failed on them. This leg runs the bare `node --test` that job used, with
  # no qmd installed.
  test-without-qmd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm qmd is absent
        shell: bash
        run: |
          if [ -d "$(npm root -g)/@tobilu/qmd" ] || command -v qmd >/dev/null; then
            echo "::error::qmd is installed on this runner; the leg would not test its absence"
            exit 1
          fi
      - name: Run hook tests without qmd
        shell: bash
        run: node --experimental-strip-types --test '.claude/scripts/tests/'*.test.ts

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install typecheck deps (CI-only, not shipped)
        shell: bash
        run: npm install --no-save --silent --prefix .claude/scripts typescript@5.6.3 @types/node@22.9.0
      - name: Install qmd globally (proves MCP wrapper resolution on this OS)
        shell: bash
        run: npm install -g @tobilu/qmd@2.1.0
      - name: Typecheck
        shell: bash
        working-directory: .claude/scripts
        run: npm run typecheck
      - name: Run hook tests
        working-directory: .claude/scripts
        run: npm test

      # A test that writes outside its temp dir is a bug wherever it lands, but
      # the release job is where it becomes the user's problem: it zipped the
      # working tree, so residue shipped inside the vault (v8.1.1 and v8.3.0 both
      # carried `Z:/definitely/not/here.jsonl`). The zip now comes from the tag,
      # which makes residue harmless — this makes it VISIBLE, at the source, on
      # the OS that produced it. Untracked output from a test run is never
      # expected; node_modules and the CI-only typecheck deps are gitignored.
      - name: No test wrote outside its temp dir
        shell: bash
        run: |
          # --ignored too: the QMD debounce sentinel is gitignored, so a test
          # that wrote the real one would pass a plain status. node_modules is
          # the CI-only typecheck install, the one ignored tree a run may leave.
          residue=$(git status --porcelain --untracked-files=all --ignored | grep -v '/node_modules/' || true)
          if [ -n "$residue" ]; then
            echo "::error::the test run left files behind in the working tree"
            echo "$residue"
            exit 1
          fi

